<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | Főoldal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome a Discord ikonhoz -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 40px;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(0, 255, 135, 0.3);
        }

        header p {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-top: 10px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 500px;
            margin: auto 0;
        }

        /* IP Másoló doboz */
        .ip-box {
            background: rgba(25, 25, 35, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .ip-box:hover {
            border-color: #00ff87;
        }

        .ip-text {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .copy-btn {
            background: #00ff87;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        /* Státusz kártya */
        .status-card {
            background: rgba(25, 25, 35, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .online { background-color: #00ff87; box-shadow: 0 0 10px #00ff87; }
        .offline { background-color: #ff4757; box-shadow: 0 0 10px #ff4757; }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .player-count {
            margin-top: 8px;
            color: #b0b0b0;
            font-size: 0.95rem;
        }

        /* Discord gomb */
        .discord-btn {
            background: #5865F2;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.4);
        }

        .discord-btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(88, 101, 242, 0.6);
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>AethelMC</h1>
        <p>Lépj be a kalandba még ma!</p>
    </header>

    <div class="main-container">
        <!-- Szerver IP és másolás -->
        <div class="ip-box">
            <span class="ip-text" id="server-ip">play.aethelmc.fun</span>
            <button class="copy-btn" onclick="copyIP()">Másolás</button>
        </div>

        <!-- Élő státusz és játékosszám -->
        <div class="status-card">
            <div id="server-status">
                <span class="status-indicator offline"></span>
                <span class="status-text">Státusz betöltése...</span>
            </div>
            <div class="player-count" id="player-count">Játékosok: - / -</div>
        </div>

        <!-- Discord Link -->
        <a href="https://discord.gg/VNHUDWdcjn" target="_blank" class="discord-btn">
            <i class="fa-brands fa-discord"></i> Csatlakozz a Discordhoz!
        </a>
    </div>

    <footer>
        &copy; 2026 AethelMC. Minden jog fenntartva.
    </footer>

    <script>
        // IP másoló funkció
        function copyIP() {
            const ipText = document.getElementById('server-ip').innerText;
            navigator.clipboard.writeText(ipText).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = 'Másolva!';
                setTimeout(() => {
                    btn.innerText = 'Másolás';
                }, 2000);
            });
        }

        // Szerver státusz lekérése API-n keresztül
        async function checkServerStatus() {
            try {
                let response = await fetch('https://api.mcsrvstat.us/3/play.aethelmc.fun');
                let data = await response.json();
                
                const statusDiv = document.getElementById('server-status');
                const playerDiv = document.getElementById('player-count');

                if (data.online) {
                    statusDiv.innerHTML = `<span class="status-indicator online"></span><span class="status-text" style="color: #00ff87;">Online</span>`;
                    playerDiv.innerText = `Játékosok: ${data.players.online} / ${data.players.max}`;
                } else {
                    statusDiv.innerHTML = `<span class="status-indicator offline"></span><span class="status-text" style="color: #ff4757;">Offline</span>`;
                    playerDiv.innerText = `A szerver jelenleg nem elérhető.`;
                }
            } catch (error) {
                document.getElementById('server-status').innerHTML = `<span class="status-indicator offline"></span><span class="status-text">Hiba történt</span>`;
            }
        }

        // Oldal betöltésekor és 30 másodpercenként frissítés
        checkServerStatus();
        setInterval(checkServerStatus, 30000);
    </script>
</body>
</html>
