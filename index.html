<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | Prémium Minecraft Szerver</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Navigáció */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        nav .logo {
            font-size: 24px;
            font-weight: 900;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #FFD700;
        }

        /* Hero Szekció */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(18, 18, 18, 0.7), rgba(18, 18, 18, 0.9)), url('https://images.unsplash.com/photo-1607513746994-51f730a44832?q=80&w=1920&auto=format&fit=crop') center/cover;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hero h1 span {
            color: #FFD700;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ccc;
        }

        /* IP Másoló Gomb */
        .ip-box {
            background: #1e1e1e;
            border: 2px solid #FFD700;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .ip-box:hover {
            background: #FFD700;
            color: #121212;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }

        /* Gombok */
        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-primary {
            background: #5865F2; /* Discord kék */
            color: white;
        }

        .btn-primary:hover {
            background: #4752C4;
        }

        .btn-secondary {
            background: #FFA500;
            color: #121212;
        }

        .btn-secondary:hover {
            background: #e69500;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AethelMC</div>
        <ul>
            <li><a href="#">Kezdőlap</a></li>
            <li><a href="https://tebex.io" target="_blank">Webshop</a></li>
            <li><a href="#">Szabályzat</a></li>
            <li><a href="#">Discord</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Üdvözlünk az <span>AethelMC</span> szerveren!</h1>
        <p>A prémium játékélmény. Csatlakozz még ma az 1.20 - 1.21-es hálózathoz!</p>
        
        <!-- Kattintható IP -->
        <div class="ip-box" onclick="copyIP()" id="ipText">
            play.aethelmc.hu
        </div>

        <div class="btn-group">
            <a href="https://discord.gg/sajatlink" class="btn btn-primary" target="_blank">Discord Szerver</a>
            <a href="https://sajatwebshop.tebex.io" class="btn btn-secondary" target="_blank">Prémium Webshop</a>
        </div>
    </header>

    <script>
        // IP másolása vágólapra
        function copyIP() {
            const ip = "play.aethelmc.hu";
            navigator.clipboard.writeText(ip).then(() => {
                const ipBox = document.getElementById("ipText");
                const originalText = ipBox.innerText;
                
                ipBox.innerText = "IP SIKERESEN MÁSOLVA!";
                ipBox.style.background = "#4CAF50";
                ipBox.style.color = "white";
                ipBox.style.borderColor = "#4CAF50";
                
                setTimeout(() => {
                    ipBox.innerText = originalText;
                    ipBox.style.background = "#1e1e1e";
                    ipBox.style.color = "white";
                    ipBox.style.borderColor = "#FFD700";
                }, 2000);
            });
        }
    </script>
</body>
</html>
