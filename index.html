<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Szerver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between">

    <main class="container mx-auto px-4 py-12 flex flex-col items-center justify-center flex-grow">
        
        <div class="text-center mb-8">
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-wider text-emerald-400 drop-shadow-lg mb-2">
                BLOCKCRAFT <span class="text-white">HU</span>
            </h1>
            <p class="text-gray-300 text-lg">A te új kedvenc Minecraft szervered!</p>
        </div>

        <div class="glass-card w-full max-w-xl rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
            
            <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                <div class="flex items-center space-x-3">
                    <span id="status-dot" class="h-4 w-4 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span id="status-text" class="font-semibold text-lg uppercase tracking-wide">Ellenőrzés...</span>
                </div>
                <div class="text-sm bg-gray-800 px-3 py-1 rounded-full text-gray-300 border border-gray-700">
                    Verzió: <span id="server-version" class="text-emerald-400 font-bold">-</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/50 text-center">
                    <p class="text-gray-400 text-sm mb-1"><i class="fa-solid fa-users text-emerald-400 mr-1"></i> Játékosok online</p>
                    <p id="player-count" class="text-3xl font-bold text-white">- / -</p>
                </div>
                <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/50 text-center">
                    <p class="text-gray-400 text-sm mb-1"><i class="fa-solid fa-signal text-emerald-400 mr-1"></i> Állapot</p>
                    <p class="text-xl font-bold text-emerald-400 mt-1">Stabil</p>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-2">Szerver IP Cím:</label>
                <div class="flex items-center bg-gray-900 rounded-xl border border-gray-700 p-2">
                    <input type="text" id="server-ip-input" readonly value="play.szerverneve.hu" 
                           class="bg-transparent w-full px-3 text-emerald-300 font-mono focus:outline-none select-all">
                    <button onclick="copyIP()" id="copy-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-medium transition flex items-center space-x-2 shadow-md">
                        <i class="fa-regular fa-copy"></i>
                        <span id="copy-text">Másolás</span>
                    </button>
                </div>
            </div>

            <div class="text-center">
                <a href="https://discord.gg/bWEK5qhvEk" target="_blank" 
                   class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-3.5 px-6 rounded-xl transition duration-300 flex items-center justify-center space-x-3 shadow-lg transform hover:-translate-y-0.5">
                    <i class="fa-brands fa-discord text-2xl"></i>
                    <span>Csatlakozz a Discord Szerverhez!</span>
                </a>
            </div>

        </div>

    </main>

    <footer class="text-center py-6 text-gray-500 text-sm">
        &copy; 2026 BlockCraft. Minden jog fenntartva.
    </footer>

    <script>
        // IDE ÍRD BE A SZERVERED VALÓS IP CÍMÉT VAGY DOMAINJÉT:
        const serverIp = 'play.hypixel.net'; // Példa kedvéért a hypixel van beállítva, cseréld le a tiédre!
        
        // Frissítjük az input mezőben is
        document.getElementById('server-ip-input').value = serverIp;

        // Szerver adatok lekérése API-ból
        async function fetchServerStatus() {
            try {
                const response = await fetch(`https://api.mcsrvstat.us/3/${serverIp}`);
                const data = await response.json();

                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                const playerCount = document.getElementById('player-count');
                const serverVersion = document.getElementById('server-version');

                if (data.online) {
                    statusDot.className = "h-4 w-4 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981]";
                    statusText.textContent = "Online";
                    statusText.className = "font-semibold text-lg uppercase tracking-wide text-emerald-400";
                    
                    playerCount.textContent = `${data.players.online} / ${data.players.max}`;
                    serverVersion.textContent = data.version || "Ismeretlen";
                } else {
                    statusDot.className = "h-4 w-4 rounded-full bg-red-500";
                    statusText.textContent = "Offline";
                    statusText.className = "font-semibold text-lg uppercase tracking-wide text-red-400";
                    
                    playerCount.textContent = "0 / 0";
                    serverVersion.textContent = "Nem elérhető";
                }
            } catch (error) {
                console.error("Hiba a szerver státusz lekérésekor:", error);
                document.getElementById('status-text').textContent = "Hiba";
            }
        }

        // IP másoló funkció
        function copyIP() {
            const inputField = document.getElementById('server-ip-input');
            const copyText = document.getElementById('copy-text');
            
            navigator.clipboard.writeText(inputField.value);
            
            copyText.textContent = "Másolva!";
            setTimeout(() => {
                copyText.textContent = "Másolás";
            }, 2000);
        }

        // Oldal betöltésekor lekérdezés, majd 30 másodpercenként automatikus frissítés
        fetchServerStatus();
        setInterval(fetchServerStatus, 30000);
    </script>
</body>
</html>
