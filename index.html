<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | A Te Világod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(3, 7, 18, 0.95)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glow-effect {
            box-shadow: 0 0 30px -5px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <div class="absolute top-0 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="container mx-auto px-4 py-12 md:py-20 flex flex-col items-center justify-center flex-grow z-10">
        
        <div class="text-center mb-10">
            <span class="inline-block bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-widest mb-3">
                Magyar Minecraft Szerver
            </span>
            <h1 class="text-5xl md:text-7xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 drop-shadow-sm">
                AETHELMC
            </h1>
            <p class="text-slate-400 text-lg mt-2 font-light">Lépj be a kalandok mezejére, építs, harcolj és dominálj!</p>
        </div>

        <div class="glass-panel w-full max-w-xl rounded-3xl p-6 md:p-10 glow-effect relative">
            
            <div class="flex justify-between items-center mb-8 bg-slate-900/40 p-4 rounded-2xl border border-slate-800">
                <div class="flex items-center space-x-3">
                    <div class="relative flex h-3.5 w-3.5">
                      <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                      <span id="status-dot" class="relative inline-flex rounded-full h-3.5 w-3.5 bg-amber-500"></span>
                    </div>
                    <span id="status-text" class="font-bold tracking-wide text-sm uppercase text-amber-400">Kapcsolódás...</span>
                </div>
                <div class="text-xs font-medium text-slate-400 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/60">
                    Verzió: <span id="server-version" class="text-emerald-400 font-bold">1.20.x</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-slate-900/50 p-5 rounded-2xl border border-slate-800/80 text-center transition hover:border-emerald-500/30">
                    <div class="text-emerald-400 text-xl mb-1"><i class="fa-solid fa-users"></i></div>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wider mb-1">Online Játékosok</p>
                    <p id="player-count" class="text-3xl font-black text-white">- / -</p>
                </div>
                <div class="bg-slate-900/50 p-5 rounded-2xl border border-slate-800/80 text-center transition hover:border-emerald-500/30">
                    <div class="text-emerald-400 text-xl mb-1"><i class="fa-solid fa-server"></i></div>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wider mb-1">Állapot</p>
                    <p id="server-status-label" class="text-lg font-bold text-emerald-400 mt-1">Betöltés...</p>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Szerver Cím (IP):</label>
                <div class="flex items-center bg-slate-950/80 rounded-2xl border border-slate-800 p-2 pl-4 focus-within:border-emerald-500 transition">
                    <input type="text" id="server-ip-input" readonly value="play.aethelmc.fun" 
                           class="bg-transparent w-full text-emerald-300 font-mono font-bold tracking-wide focus:outline-none select-all text-sm md:text-base">
                    <button onclick="copyIP()" id="copy-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-semibold text-sm transition duration-300 flex items-center space-x-2 shadow-lg shadow-emerald-900/20 active:scale-95">
                        <i class="fa-regular fa-copy"></i>
                        <span id="copy-text">Másolás</span>
                    </button>
                </div>
            </div>

            <div>
                <a href="https://discord.gg/bWEK5qhvEk" target="_blank" 
                   class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-4 px-6 rounded-2xl transition duration-300 flex items-center justify-center space-x-3 shadow-lg shadow-indigo-900/30 transform hover:-translate-y-0.5 active:translate-y-0">
                    <i class="fa-brands fa-discord text-2xl"></i>
                    <span>Csatlakozz a Discord Közösséghez</span>
                </a>
            </div>

        </div>

    </main>

    <footer class="text-center py-6 text-slate-500 text-xs z-10 border-t border-slate-800/60 bg-slate-950/40">
        &copy; 2026 AethelMC. Minden jog fenntartva. Nem áll kapcsolatban a Mojanggal.
    </footer>

    <script>
        const serverIp = 'play.aethelmc.fun';
        document.getElementById('server-ip-input').value = serverIp;

        async function fetchServerStatus() {
            try {
                const response = await fetch(`https://api.mcsrvstat.us/3/${serverIp}`);
                const data = await response.json();

                const statusDot = document.getElementById('status-dot');
                const statusPing = document.getElementById('status-ping');
                const statusText = document.getElementById('status-text');
                const playerCount = document.getElementById('player-count');
                const serverVersion = document.getElementById('server-version');
                const serverStatusLabel = document.getElementById('server-status-label');

                if (data.online) {
                    statusDot.className = "relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500";
                    statusPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
                    statusText.textContent = "Szerver Online";
                    statusText.className = "font-bold tracking-wide text-sm uppercase text-emerald-400";
                    
                    playerCount.textContent = `${data.players.online} / ${data.players.max}`;
                    serverVersion.textContent = data.version || "1.20.x";
                    serverStatusLabel.textContent = "Stabil";
                } else {
                    statusDot.className = "relative inline-flex rounded-full h-3.5 w-3.5 bg-rose-500";
                    statusPing.className = "hidden";
                    statusText.textContent = "Szerver Offline";
                    statusText.className = "font-bold tracking-wide text-sm uppercase text-rose-400";
                    
                    playerCount.textContent = "0 / 0";
                    serverVersion.textContent = "Nem elérhető";
                    serverStatusLabel.textContent = "Karbantartás";
                }
            } catch (error) {
                console.error("Hiba lekérés közben:", error);
                document.getElementById('status-text').textContent = "Hiba történt";
            }
        }

        function copyIP() {
            const inputField = document.getElementById('server-ip-input');
            const copyText = document.getElementById('copy-text');
            const copyBtn = document.getElementById('copy-btn');
            
            navigator.clipboard.writeText(inputField.value);
            
            copyText.textContent = "Másolva!";
            copyBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
            copyBtn.classList.add('bg-teal-700');

            setTimeout(() => {
                copyText.textContent = "Másolás";
                copyBtn.classList.remove('bg-teal-700');
                copyBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
            }, 2000);
        }

        // Első lekérdezés és automatikus frissítés
        fetchServerStatus();
        setInterval(fetchServerStatus, 30000);
    </script>
</body>
</html>
