<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>RedVortexNetwork | Pro Animation</title>
    <style>
        :root { --red: #ff003c; --blue: #00f2ff; --bg: #050505; }
        
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }

        /* Animáció: Pulzáló ragyogás */
        @keyframes glow {
            0% { box-shadow: 0 0 5px var(--red); }
            50% { box-shadow: 0 0 20px var(--red); }
            100% { box-shadow: 0 0 5px var(--red); }
        }

        /* Animáció: Belúszás */
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animated { animation: slideUp 1s ease-out; }

        .btn-animate {
            background: var(--red);
            padding: 15px 30px;
            border: none;
            color: white;
            cursor: pointer;
            animation: glow 2s infinite;
            transition: 0.3s;
        }

        .btn-animate:hover { transform: scale(1.1); background: var(--blue); }

        .card {
            background: #111;
            padding: 30px;
            margin: 20px;
            border-left: 5px solid var(--red);
            transition: 0.5s;
        }

        .card:hover { transform: rotate(2deg) scale(1.05); }

        h1 { text-align: center; color: var(--red); animation: glow 3s infinite; }
    </style>
</head>
<body>

    <h1 class="animated">REDVORTEX NETWORK</h1>

    <div class="card animated">
        <h2>Prémium Rangok</h2>
        <p>Vásárold meg a legmenőbb rangokat!</p>
        <button class="btn-animate">VÁSÁRLÁS</button>
    </div>

    <div class="card animated" style="animation-delay: 0.3s;">
        <h2>Coin Rendszer</h2>
        <p>Válts coinokat és nyisd ki a ládákat!</p>
        <button class="btn-animate">COIN SHOP</button>
    </div>

    <div class="card animated" style="animation-delay: 0.6s;">
        <h2>Szabályzat</h2>
        <p>Tiszteld a szervert, vagy repülsz!</p>
    </div>

    <div style="text-align: center; margin-top: 50px;">
        <img src="https://img.icons8.com/color/48/000000/paypal.png" alt="PayPal" style="filter: invert(1);">
        <img src="https://img.icons8.com/color/48/000000/visa.png" alt="Visa" style="filter: invert(1);">
    </div>

</body>
</html>
