<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>RedVortexNetwork | Global Control</title>
    <style>
        /* Animált háttér - "Lélegző vörös köd" */
        @keyframes bgAnim { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        :root { --red: #ff003c; --gold: #ffd700; --panel: rgba(10, 10, 10, 0.85); }
        
        body { 
            margin: 0; font-family: 'Rajdhani', sans-serif; 
            background: linear-gradient(45deg, #050505, #1a0006, #050505);
            background-size: 400% 400%; animation: bgAnim 15s ease infinite;
            color: white; overflow-x: hidden;
        }

        /* Navigáció */
        nav { display: flex; justify-content: center; padding: 40px; gap: 50px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
        nav a { color: white; text-decoration: none; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; transition: 0.3s; }
        nav a:hover { color: var(--red); text-shadow: 0 0 15px var(--red); }

        /* Főoldal elemei */
        .hero { text-align: center; padding: 100px 20px; }
        .hero h1 { font-size: 6rem; margin: 0; color: white; text-shadow: 0 0 30px var(--red); }
        
        /* Rangok - Exkluzív nevekkel */
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; padding: 50px; }
        .card { 
            background: var(--panel); border: 2px solid #333; padding: 40px; 
            text-align: center; transition: 0.5s; border-radius: 20px;
        }
        .card:hover { border-color: var(--red); box-shadow: 0 0 40px rgba(255,0,60,0.4); transform: translateY(-20px); }
        
        /* Coin rendszer - Menő stílusban */
        .coin-box { 
            background: linear-gradient(135deg, #1a1a1a, #000); 
            border: 2px solid var(--gold); padding: 30px; border-radius: 15px;
            box-shadow: inset 0 0 20px rgba(255,215,0,0.2);
        }
        
        .btn { background: var(--red); color: white; padding: 15px 30px; border: none; cursor: pointer; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .btn:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--red); }
    </style>
</head>
<body>

<nav>
    <a href="#home">KÖZPONT</a>
    <a href="#rangok">RANGOK</a>
    <a href="#coins">COIN TŐZSDE</a>
</nav>

<div id="home" class="hero">
    <h1>REDVORTEX</h1>
    <p>A hálózat, ami felemészt.</p>
</div>

<div id="rangok" class="shop-grid">
    <div class="card">
        <h3>VORTEX-INITIATE</h3>
        <p>Alap belépési rang kozmetikumokkal.</p>
        <button class="btn">1.990 Ft</button>
    </div>
    <div class="card">
        <h3 style="color:var(--gold);">NEBULA-COMMANDER</h3>
        <p>Kiemelt hozzáférés, egyedi effektek.</p>
        <button class="btn">4.990 Ft</button>
    </div>
    <div class="card" style="border-color:var(--red);">
        <h3>VOID-LEGEND</h3>
        <p>Az abszolút hatalom a szerveren.</p>
        <button class="btn">9.990 Ft</button>
    </div>
</div>

<div id="coins" class="shop-grid">
    <div class="card coin-box">
        <h3>500 V-COIN</h3>
        <p>Gyors feltöltés.</p>
        <button class="btn">500 Ft</button>
    </div>
    <div class="card coin-box">
        <h3>2500 V-COIN</h3>
        <p>Bónusz: 20% extra!</p>
        <button class="btn">2.000 Ft</button>
    </div>
</div>

</body>
</html>
