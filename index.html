<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | Főoldal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { 
            background-color: #030712; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            position: relative;
        }

        /* Háttér mozgó neon fények */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(16, 185, 129, 0.1));
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 8s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(-30px, -30px); }
            100% { transform: scale(1.2) translate(30px, 30px); }
        }

        .hero { 
            text-align: center; 
            max-width: 440px; 
            width: 90%;
            padding: 40px 30px; 
            background: rgba(11, 15, 25, 0.75);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .logo-img { 
            max-width: 130px; 
            margin-bottom: 25px; 
            filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.7)); 
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 35px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .main-btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%; 
            padding: 15px; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(30, 41, 59, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #e2e8f0; 
        }
        
        .main-btn:hover { 
            background: rgba(139, 92, 246, 0.15);
            border-color: #8b5cf6; 
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.25);
        }

        .btn-primary { 
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="hero">
        <img src="logo.png" alt="AethelMC Logo" class="logo-img">
        
        <h1>AethelMC</h1>
        <p>A prémium Minecraft élmény</p>
        
        <div class="btn-container">
            <a href="banyakozpont.html" class="main-btn btn-primary">💎 Bányaközpont</a>
            <a href="#" class="main-btn">🛒 Webshop</a>
            <a href="https://discord.gg/IttADiscordLink" class="main-btn">💬 Discord Közösség</a>
        </div>
    </div>

</body>
</html>
