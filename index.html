<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | Főoldal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome ikonok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #05070d;
            background-image: 
                radial-gradient(at 15% 15%, rgba(16, 185, 129, 0.25) 0px, transparent 45%),
                radial-gradient(at 85% 85%, rgba(88, 101, 242, 0.25) 0px, transparent 45%),
                radial-gradient(at 50% 50%, rgba(59, 130, 246, 0.15) 0px, transparent 60%),
                url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop');
            background-blend-mode: overlay;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* Fő fejléc */
        header {
            text-align: center;
            margin-top: 40px;
            animation: fadeInDown 1s ease;
        }

        .badge-top {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        header h1 {
            font-size: 4.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 0 40px rgba(16, 185, 129, 0.4));
        }

        header p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-top: 8px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Tartalom doboz */
        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin: auto 0;
            animation: fadeInUp 1s ease;
        }

        /* IP másoló kártya */
        .ip-card {
            background: rgba(13, 19, 38, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 22px 28px;
            border-radius: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: 0.3s ease;
        }

        .ip-card:hover {
            border-color: rgba(16, 185, 129, 0.6);
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.2);
        }

        .ip-info span {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .ip-info h3 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .btn-copy {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-copy:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
        }

        /* Státusz és adatok kártya */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .card {
            background: rgba(13, 19, 38, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 24px;
            border-radius: 22px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            transition: 0.3s ease;
        }

        .card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-3px);
        }

        .card-title {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .badge-online {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-offline {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .badge-online .pulse { background: #10b981; box-shadow: 0 0 12px #10b981; }
        .badge-offline .pulse { background: #ef4444; box-shadow: 0 0 12px #ef4444; }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #f8fafc;
            margin-top: 5px;
        }

        /* Célkitűzés kártya (Discord 60 fő) */
        .goal-card {
            background: rgba(13, 19, 38, 0.8);
            border: 1px solid rgba(88, 101, 242, 0.3);
            padding: 20px 24px;
            border-radius: 22px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: 0.3s ease;
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .goal-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: #c7d2fe;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .goal-title i {
            color: #5865F2;
        }

        .goal-count {
            font-size: 0.9rem;
            font-weight: 800;
            color: #818cf8;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #5865F2, #10b981);
            border-radius: 50px;
            width: 45%; /* Itt állíthatod a százalékot, ahogy nő a Discord tagok száma */
            transition: width 1s ease;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.5);
        }

        /* Közösségi sáv (Discord / Webshop gombok) */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .social-btn {
            background: rgba(13, 19, 38, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px;
            border-radius: 16px;
            color: white;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            backdrop-filter: blur(20px);
        }

        .discord-btn:hover {
            background: #5865F2;
            border-color: #5865F2;
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.5);
            transform: translateY(-3px);
        }

        .shop-btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.5);
            transform: translateY(-3px);
        }

        .social-btn i {
            font-size: 1.3rem;
        }

        footer {
            text-align: center;
            color: #475569;
            font-size: 0.9rem;
            margin-top: 30px;
        }

        /* Animációk */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="badge-top"><i class="fa-solid fa-fire"></i> Új Generációs Szerver</div>
        <h1>AethelMC</h1>
        <p>A te új kedvenc Minecraft szervered</p>
    </header>

    <div class="container">
        <!-- Szerver IP Doboz -->
        <div class="ip-card">
            <div class="ip-info">
                <span>Szerver Cím (IP)</span>
                <h3 id="server-ip">play.aethelmc.fun</h3>
            </div>
            <button class="btn-copy" onclick="copyIP()">Másolás</button>
        </div>

        <!-- Státusz és Játékosok Grid -->
        <div class="status-grid">
            <div class="card">
                <div class="card-title">Szerver Státusz</div>
                <div id="status-container">
                    <div class="status-badge badge-offline">
                        <span class="pulse"></span> Betöltés...
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">Játékosok Online</div>
                <div class="stat-value" id="player-count">- / -</div>
            </div>
        </div>

        <!-- Discord Közösségi Cél (Legyünk 60-an) -->
        <div class="goal-card">
            <div class="goal-header">
                <div class="goal-title">
                    <i class="fa-brands fa-discord"></i> Cél: Legyünk összesen 60-an Discordon!
                </div>
                <div class="goal-count" id="discord-goal-text">27 / 60</div>
            </div>
            <div class="progress-bar">
                <!-- A style="width: XX%" értéket átírhatod ahogy nő a Discord tagok száma -->
                <div class="progress-fill" style="width: 45%;"></div>
            </div>
        </div>

        <!-- Discord és Shop gombok -->
        <div class="social-grid">
            <a href="https://discord.gg/VNHUDWdcjn" target="_blank" class="social-btn discord-btn">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
            <a href="./shop.html" class="social-btn shop-btn">
                <i class="fa-solid fa-store"></i> Webshop
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 AethelMC. Minden jog fenntartva.
    </footer>

    <script>
        function copyIP() {
            const ipText = document.getElementById('server-ip').innerText;
            navigator.clipboard.writeText(ipText).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerText = 'Másolva!';
                btn.style.background = 'linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)';
                setTimeout(() => {
                    btn.innerText = 'Másolás';
                    btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                }, 2000);
            });
        }

        async function checkServer() {
            try {
                let response = await fetch('https://api.mcsrvstat.us/3/play.aethelmc.fun');
                let data = await response.json();
                
                const statusContainer = document.getElementById('status-container');
                const playerCount = document.getElementById('player-count');

                if (data.online) {
                    statusContainer.innerHTML = `
                        <div class="status-badge badge-online">
                            <span class="pulse"></span> Online
                        </div>
                    `;
                    playerCount.innerText = `${data.players.online} / ${data.players.max}`;
                } else {
                    statusContainer.innerHTML = `
                        <div class="status-badge badge-offline">
                            <span class="pulse"></span> Offline
                        </div>
                    `;
                    playerCount.innerText = "0 / 0";
                }
            } catch (e) {
                document.getElementById('status-container').innerHTML = `
                    <div class="status-badge badge-offline">
                        <span class="pulse"></span> Hiba
                    </div>
                `;
            }
        }

        checkServer();
        setInterval(checkServer, 30000);
    </script>
</body>
</html>
