<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedVortexNetwork - Kezdőlap</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; background-color: #121212; color: #ffffff; }
        header { background-color: #1f1f1f; padding: 20px; text-align: center; border-bottom: 3px solid #ff4757; }
        .main-container { padding: 50px; text-align: center; }
        .btn-rank { background-color: #ff4757; color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        
        footer { background-color: #000; padding: 30px; text-align: center; margin-top: 50px; border-top: 1px solid #333; }
        .payment-methods img { width: 50px; margin: 0 10px; filter: grayscale(100%); opacity: 0.7; }
        .payment-methods img:hover { filter: grayscale(0%); opacity: 1; }
    </style>
</head>
<body>

<header>
    <h1>RedVortexNetwork</h1>
</header>

<div class="main-container">
    <h2>Üdvözöllek a szerver webshopjában!</h2>
    <p>Vásárolj rangokat, és alakítsd ki saját, egyedi megjelenésedet a szerveren.</p>
    <br>
    <a href="/login" class="btn-rank">Bejelentkezés & Rangvásárlás</a>
</div>

<footer>
    <p>© 2026 RedVortexNetwork - Minden jog fenntartva.</p>
    <div class="payment-methods">
        <img src="paypal-logo.png" alt="PayPal">
        <img src="stripe-logo.png" alt="Stripe">
        <img src="paysafecard-logo.png" alt="Paysafecard">
    </div>
</footer>

</body>
</html>
