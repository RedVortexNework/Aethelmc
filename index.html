<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | Főoldal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #030712; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden;
            position: relative;
        }
        
        /* Háttér díszes fényfoltok */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.15);
            filter: blur(120px);
            border-radius: 50%;
            top: 10%;
            z-index: -1;
        }

        .hero { 
            text-align: center; 
            max-width: 480px; 
            width: 100%;
            padding: 30px; 
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-img { 
            max-width: 140px; 
            margin-bottom: 20px; 
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.6)); 
        }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(30, 41, 59, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            color: white; 
        }
        
        .main-btn:hover { 
            background: #8b5cf6; 
            border-color: #a78bfa; 
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .btn-primary { 
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="logo.png" alt="AethelMC Logo" class="logo-img">
        
        <h1>AethelMC</h1>
        <p>Lépj be a jövő szervervilágába</p>
        
        <div class="btn-container">
            <a href="banyakozpont.html" class="main-btn btn-primary">💎 Bányaközpont</a>
            <a href="#" class="main-btn">🛒 Webshop</a>
            <a href="https://discord.gg/IttADiscordLink" class="main-btn">💬 Discord közösség</a>
        </div>
    </div>

</body>
</html>
