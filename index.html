<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | Hivatalos Oldal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #030508; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-image: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 60%); }
        
        .hero { text-align: center; max-width: 600px; padding: 20px; }
        .logo-img { max-width: 300px; margin-bottom: 30px; filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.4)); }
        
        .main-btn { 
            display: block; width: 100%; padding: 18px; margin: 10px 0; border-radius: 12px; 
            text-decoration: none; font-weight: 600; text-align: center; transition: 0.3s;
            background: #1e293b; border: 1px solid #334155; color: white; font-size: 1.1rem;
        }
        .main-btn:hover { background: #8b5cf6; border-color: #8b5cf6; transform: translateY(-3px); }
        .login-btn { background: #10b981; border: none; }
    </style>
</head>
<body>

    <div class="hero">
        <img src="logo.png" alt="AethelMC Logo" class="logo-img">
        
        <h1>Üdvözöl az AethelMC</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">A legjobb választás a szerveren.</p>
        
        <a href="banyakozpont.html" class="main-btn login-btn">💎 Belépés a Bányaközpontba</a>
        <a href="dashboard.html" class="main-btn">📊 Irányítópult (Dashboard)</a>
        <a href="#" class="main-btn">🛒 Webshop</a>
        <a href="https://discord.gg/IttADiscordLink" class="main-btn">💬 Discord közösség</a>
    </div>

</body>
</html>
