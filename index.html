<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | A Te Új Világod</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
        }

        header {
            padding: 30px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        main {
            text-align: center;
            max-width: 700px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 800;
            line-height: 1.2;
        }

        h1 span {
            color: #8b5cf6;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .ip-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 15px 30px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .ip-box:hover {
            border-color: #8b5cf6;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
        }

        .ip-text {
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        .copy-btn {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #7c3aed;
        }

        .buttons-container {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-discord {
            background: #5865F2;
            color: white;
        }

        .btn-discord:hover {
            background: #4752c4;
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }

        footer {
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AethelMC</div>
    </header>

    <main>
        <h1>Készülj fel a <span>Legenda</span> Utazásra!</h1>
        <p>Egy új, egyedi Minecraft szerver élmény vár rád. Építs, harcolj és hódíts meg mindent a közösséggel!</p>

        <div class="ip-box" onclick="copyIP()">
            <span class="ip-text" id="server-ip">play.aethelmc.hu</span>
            <button class="copy-btn">Másolás</button>
        </div>

        <div class="buttons-container">
            <a href="#" class="btn btn-discord">Discord Közösség</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 AethelMC. Minden jog fenntartva.</p>
    </footer>

    <script>
        function copyIP() {
            const ipText = document.getElementById("server-ip").innerText;
            navigator.clipboard.writeText(ipText);
            const btn = document.querySelector(".copy-btn");
            btn.innerText = "Másolva!";
            setTimeout(() => {
                btn.innerText = "Másolás";
            }, 2000);
        }
    </script>
</body>
</html>
