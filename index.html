<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>RedVortexNetwork | Pro Gaming</title>
    <style>
        :root {
            --neon-red: #ff0055;
            --neon-blue: #00d4ff;
            --dark-bg: #0a0a0c;
        }

        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; 
            background: radial-gradient(circle at 50% 50%, #1a0a1a, #000); 
            color: white; 
        }

        /* Navigáció színátmenettel */
        .nav { 
            display: flex; justify-content: center; padding: 25px; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(15px);
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(to right, var(--neon-red), var(--neon-blue)) 1;
        }
        .nav a { color: white; margin: 0 20px; text-decoration: none; font-weight: 800; text-transform: uppercase; }
        .nav a:hover { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        /* Kártya dizájn (Üveg hatás) */
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; border-radius: 20px; text-align: center;
            transition: 0.5s;
        }
        .card:hover { border-color: var(--neon-red); box-shadow: 0 0 30px rgba(255,0,85,0.2); }

        /* Színes gombok */
        .btn-red { background: linear-gradient(45deg, #ff0055, #ff0000); padding: 15px 30px; border-radius: 50px; border: none; color: white; font-weight: bold; cursor: pointer; }
        .btn-blue { background: linear-gradient(45deg, #00d4ff, #0055ff); padding: 15px 30px; border-radius: 50px; border: none; color: white; font-weight: bold; cursor: pointer; }

        .title { font-size: 3rem; background: linear-gradient(to right, var(--neon-red), var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

<div class="nav">
    <a href="#">Főoldal</a>
    <a href="#">Rangok</a>
    <a href="#">Coin Shop</a>
    <a href="#">Szabályzat</a>
</div>

<div style="max-width: 900px; margin: 50px auto; padding: 20px;">
    <h1 class="title">REDVORTEX NETWORK</h1>
    
    <div class="card">
        <h2>Vásárlási központ</h2>
        <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
            <button class="btn-red">Rangok vásárlása</button>
            <button class="btn-blue">Coinok vásárlása</button>
        </div>
        <div style="margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
            <div style="background: white; padding: 10px; border-radius: 8px; color: black; font-weight: bold;">PAYPAL</div>
            <div style="background: white; padding: 10px; border-radius: 8px; color: black; font-weight: bold;">STRIPE</div>
        </div>
    </div>
</div>

</body>
</html>
