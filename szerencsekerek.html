<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | Szerencsekerék</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#8b5cf6', 600: '#7c3aed', accent: '#06b6d4' } } } } }
    </script>
    <style>.glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(139, 92, 246, 0.2); }</style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <nav class="sticky top-0 z-50 glass border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="font-black text-2xl bg-gradient-to-r from-white via-brand-400 to-cyan-400 bg-clip-text text-transparent">AETHELMC</a>
            <div class="flex space-x-6 text-sm font-medium">
                <a href="index.html" class="hover:text-brand-400">Főoldal</a>
                <a href="rang.html" class="hover:text-brand-400 text-cyan-400"><i class="fa-solid fa-gem mr-1"></i> Rangok & Bolt</a>
                <a href="szerencsekerek.html" class="text-brand-400 font-bold"><i class="fa-solid fa-arrows-spin mr-1"></i> Szerencsekerék</a>
                <a href="szabalyzat.html" class="hover:text-brand-400 text-red-400">Szabályzat</a>
            </div>
        </div>
    </nav>

    <section class="py-12 px-4 max-w-xl mx-auto text-center">
        <div class="glass p-8 rounded-3xl border border-brand-500/30 space-y-6">
            <h1 class="text-3xl font-black">Napi Szerencsekerék</h1>
            <p class="text-xs text-gray-400">Teszteld a szerencsédet! (A nyerési esély kifejezetten alacsony!)</p>

            <div class="relative w-56 h-56 mx-auto flex items-center justify-center rounded-full border-8 border-brand-500/40 bg-gray-900 shadow-2xl">
                <div id="wheel-inner" class="font-bold text-lg">🎁 Szerencsekerék</div>
            </div>

            <button onclick="spinWheel()" id="spin-btn" class="px-8 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 font-bold text-sm transition">
                Pörgetés!
            </button>

            <div id="result" class="hidden p-4 rounded-xl bg-gray-900 border border-gray-800 text-sm font-semibold"></div>
        </div>
    </section>

    <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        &copy; 2026 AethelMC Network
    </footer>

    <script>
        function spinWheel() {
            const res = document.getElementById('result');
            res.classList.remove('hidden');
            const rand = Math.random();
            if(rand < 0.85) {
                res.innerHTML = '<span class="text-red-400">Sajnos semmi! Legközelebb talán szerencséd lesz.</span>';
            } else if(rand < 0.97) {
                res.innerHTML = '<span class="text-cyan-400">Nyertél 1 AC Coin-t! Nyiss ticketet a Discordon!</span>';
            } else {
                res.innerHTML = '<span class="text-green-400">GRATULÁLUNK! Nyertél egy Rangot! Nyiss ticketet a Discordon!</span>';
            }
        }
    </script>
</body>
</html>
