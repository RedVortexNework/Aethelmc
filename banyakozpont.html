<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AethelMC | Bányaközpont</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 16px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        .logo-img { max-width: 160px; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.5)); }
        h2 { font-size: 1.4rem; margin-bottom: 5px; color: #f8fafc; }
        .subtitle { font-size: 0.9rem; color: #94a3b8; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #8b5cf6; }
        .btn { width: 100%; background: #10b981; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #059669; }
        .toggle-link { margin-top: 15px; font-size: 0.85rem; color: #94a3b8; cursor: pointer; }
        .toggle-link span { color: #8b5cf6; font-weight: 600; }
        .error-msg { color: #ef4444; font-size: 0.8rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo.png" alt="Logo" class="logo-img">
        <h2 id="form-title">Bejelentkezés</h2>
        <p class="subtitle" id="form-subtitle">Lépj be a Bányaközpontba</p>

        <div class="error-msg" id="errorBox">Hiba történt!</div>

        <form id="authForm">
            <div class="form-group">
                <label>Játékosnév</label>
                <input type="text" id="username" placeholder="felhasználónév" required>
            </div>
            <div class="form-group">
                <label>Jelszó</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Bejelentkezés</button>
        </form>

        <div class="toggle-link" onclick="toggleMode()">
            <span id="toggleText">Nincs még fiókod? Regisztrálj itt!</span>
        </div>
    </div>

    <script>
        let isRegister = false;

        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById('form-title').innerText = isRegister ? 'Regisztráció' : 'Bejelentkezés';
            document.getElementById('form-subtitle').innerText = isRegister ? 'Hozz létre egy új fiókot' : 'Lépj be a Bányaközpontba';
            document.getElementById('submitBtn').innerText = isRegister ? 'Fiók létrehozása' : 'Bejelentkezés';
            document.getElementById('toggleText').innerText = isRegister ? 'Már van fiókod? Jelentkezz be!' : 'Nincs még fiókod? Regisztrálj itt!';
            document.getElementById('errorBox').style.display = 'none';
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');

            if (isRegister) {
                if(localStorage.getItem('user_' + user)) {
                    errorBox.innerText = 'Ez a felhasználónév már létezik!';
                    errorBox.style.display = 'block';
                    return;
                }
                localStorage.setItem('user_' + user, pass);
                localStorage.setItem('currentUser', user);
                alert('Sikeres regisztráció!');
                window.location.href = 'dashboard.html';
            } else {
                const savedPass = localStorage.getItem('user_' + user);
                if (!savedPass || savedPass !== pass) {
                    errorBox.innerText = 'Hibás felhasználónév vagy jelszó!';
                    errorBox.style.display = 'block';
                    return;
                }
                localStorage.setItem('currentUser', user);
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
